<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Study With Me</title>
</head>
<body>
    
    <div class="container">
        <div class="button">
            <button class="pomodoro" id="pomodoro">pomodoro</button>
            <button class="short-break" id="short">short break</button>
            <button class="long-break" id="long">long break</button>
        </div>

        <div class="clock">
            <h2 id="clock">25:00</h2>
        </div>

        <div class="option">
            <button class="start" id="start">start</button>

            <button class="restart">
                <img src="../Image/restart.png">
            </button>
            
            <button class="setting">
                <img src="../Image/setting.png">
            </button>
        </div>

        <div class="audio">
            <iframe allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
            frameBorder="0" allowfullscreen=""
            src="https://open.spotify.com/embed/track/0j94vdVS5r1b6FT2Yvz92C?utm_source=generator&theme=0&si=3e913f2a040e4305"
            loading="lazy">
            
            </iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
